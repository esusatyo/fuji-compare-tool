<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera &amp; Lens Comparison</title>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="365e9ee6-1fb5-4a0d-9c74-f6255522a196"></script>
  <script>
    // Pure redirector: send visitors straight to a brand compare page.
    // First-time visitors default to Canon; returning visitors go to their
    // last-used brand (localStorage['brand']). The URL hash is preserved.
    (function() {
      const VALID_BRANDS = ['canon', 'fujifilm', 'sony'];
      const DEFAULT_BRAND = 'canon';
      const stored = localStorage.getItem('brand');
      const brand = VALID_BRANDS.includes(stored) ? stored : DEFAULT_BRAND;
      location.replace('./' + brand + '/' + (location.hash || ''));
    })();
  </script>
</head>
<body></body>
</html>
